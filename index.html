<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极速扫码助手 v1.0</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #007AFF; }
        body { font-family: -apple-system, system-ui; margin: 0; background: #f0f0f7; color: #333; }
        #reader { width: 100%; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .controls { padding: 15px; display: flex; gap: 10px; justify-content: center; }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-download { background: #28a745; color: white; }
        .btn-clear { background: #dc3545; color: white; }
        
        #log-container { padding: 15px; }
        .log-item { 
            background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .log-info { display: flex; flex-direction: column; }
        .log-id { font-weight: bold; font-size: 16px; color: var(--primary); }
        .log-time { font-size: 12px; color: #888; }
        .thumb { width: 50px; height: 50px; border-radius: 4px; object-fit: cover; }
        
        /* 扫描成功动画 */
        .scan-flash { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.8); display:none; pointer-events: none; }
    </style>
</head>
<body>

<div id="reader"></div>
<div class="scan-flash" id="flash"></div>

<div class="controls">
    <button class="btn-download" onclick="downloadExcel()">下载 Excel 报表</button>
    <button class="btn-clear" onclick="clearData()">清空记录</button>
</div>

<div id="log-container">
    <h3 id="counter">已扫描: 0 条</h3>
    <div id="log-list"></div>
</div>

<script>
    let scanData = JSON.parse(localStorage.getItem('scanned_items') || '[]');
    let lastScan = ""; // 防重复扫描
    let isProcessing = false;

    const html5QrCode = new Html5Qrcode("reader");

    // 更新界面显示
    function updateUI() {
        const list = document.getElementById('log-list');
        list.innerHTML = "";
        document.getElementById('counter').innerText = `已扫描: ${scanData.length} 条`;
        
        scanData.slice().reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `
                <div class="log-info">
                    <span class="log-id">${item.code}</span>
                    <span class="log-time">${item.time}</span>
                </div>
                <img src="${item.img}" class="thumb">
            `;
            list.appendChild(div);
        });
        localStorage.setItem('scanned_items', JSON.stringify(scanData));
    }

    // 扫描成功逻辑
    const onScanSuccess = (decodedText) => {
        // 1. 防抖逻辑：如果 2 秒内扫描到同一个码，不触发
        if (decodedText === lastScan || isProcessing) return;
        
        isProcessing = true;
        lastScan = decodedText;
        setTimeout(() => { lastScan = ""; }, 2000);

        // 2. 交互反馈
        if (navigator.vibrate) navigator.vibrate([100]);
        document.getElementById('flash').style.display = 'block';
        setTimeout(() => { document.getElementById('flash').style.display = 'none'; }, 100);

        // 3. 抓拍
        const video = document.querySelector('#reader video');
        const canvas = document.createElement('canvas');
        canvas.width = 160; // 缩略图减小体积，节省手机内存
        canvas.height = 120;
        canvas.getContext('2d').drawImage(video, 0, 0, 160, 120);
        const imgData = canvas.toDataURL("image/jpeg", 0.6); // 压缩图片质量

        // 4. 保存数据
        const newItem = {
            code: decodedText,
            time: new Date().toLocaleString(),
            img: imgData
        };
        scanData.push(newItem);
        updateUI();
        
        isProcessing = false;
    };

    // 导出 Excel
    function downloadExcel() {
        if (scanData.length === 0) return alert("没有记录可导出");
        const worksheet = XLSX.utils.json_to_sheet(scanData.map(i => ({ "单号": i.code, "扫描时间": i.time })));
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "扫描记录");
        XLSX.writeFile(workbook, `扫描记录_${new Date().getTime()}.xlsx`);
    }

    function clearData() {
        if (confirm("确定要清空所有记录吗？")) {
            scanData = [];
            updateUI();
        }
    }

    // 启动
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 20, qrbox: { width: 250, height: 200 } },
        onScanSuccess
    );

    updateUI(); // 初始化加载
</script>
</body>
</html>
